<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aan tafel</title>
<style>body{font-family:Georgia,serif;background:#f1ede3;color:#1f2a22;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}form{text-align:center}input{font-size:28px;padding:10px 14px;width:9em;text-align:center;border-radius:12px;border:1px solid #9a9}button{font-size:20px;padding:12px 26px;border-radius:999px;border:0;background:#3f6b4a;color:#fff;margin-top:14px}p{opacity:.7}</style></head>
<body><form id="f"><h1>Aan tafel</h1><p>Typ het woord en ga naar de tafel.</p><input id="pin" autocomplete="off" autocapitalize="none" autofocus><br><button>Ga</button><p id="msg"></p></form>
<script>
const ct=Uint8Array.from(atob("iXRcmGmz8VIT+CiWiE87WN6gzB7rebnXuqIUs6qAUWY5Btg0V/PIcVIOeSqqufzsKnR0ossbCwRifHQwabEDx89dPaBOW3vHz69+tJZOMA=="),c=>c.charCodeAt(0));const check="ac32b85b841514e6";const updated="2026-09-29 16:56";
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return new Uint8Array(b);}
function hex(u){return [...u].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function go(pin){if(hex(await sha(pin+'|check')).slice(0,16)!==check){document.getElementById('msg').textContent='Dat is niet het woord.';return;}
let ks=new Uint8Array(0),i=0;while(ks.length<ct.length){const h=await sha(pin+'|'+i);const n=new Uint8Array(ks.length+h.length);n.set(ks);n.set(h,ks.length);ks=n;i++;}
const url=new TextDecoder().decode(ct.map((b,j)=>b^ks[j]));try{localStorage.setItem('aanTafelPin',pin);}catch{}location.replace(url);}
document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('pin').value.trim().toLowerCase());};
try{const p=localStorage.getItem('aanTafelPin');if(p)go(p);}catch{}
document.getElementById('msg').textContent='Link bijgewerkt '+updated;
</script></body></html>
